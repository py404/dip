[project]
name = "dip"
version = "0.1.0"
description = "Adaptive Agentic Document Intelligence Platform"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["api"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["api/src"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ty>=0.0.59",
]
